server:
  port: 8080

spring:
  application:
    name: aerosaga-backend
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

aerosaga:
  temporal:
    # The gRPC endpoint of the Temporal cluster started by docker compose.
    target: ${TEMPORAL_TARGET:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    # Every worker in AeroSaga polls this one queue. Week 2 puts both workflow types on it.
    task-queue: ${TEMPORAL_TASK_QUEUE:aero-tq}
  supabase:
    # Leave empty to fall back to the in-memory demo fleet (nothing is blocked).
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  home-base:
    label: ${HOME_LABEL:Hyderabad Hub}
    lat: ${HOME_LAT:17.3850}
    lng: ${HOME_LNG:78.4867}

logging:
  level:
    root: INFO
    com.aerosaga: INFO
    io.temporal: WARN
