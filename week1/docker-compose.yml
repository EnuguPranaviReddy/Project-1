# AeroSaga — local Temporal cluster (Week 1 & Week 2 use the identical cluster).
#
#   docker compose up -d      -> frontend gRPC :7233, Web UI :8088, Postgres :5432
#   docker compose down       -> stop, keep data
#   docker compose down -v    -> stop, WIPE the Temporal database
#
# "auto-setup" is the official Temporal image that creates the default namespace and
# the system schemas on first boot. Do not run it twice against the same empty volume
# at the same time.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aerosaga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - temporal-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:latest
    container_name: aerosaga-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro

  temporal-ui:
    image: temporalio/ui:latest
    container_name: aerosaga-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8088:8080"

volumes:
  temporal-pg:
