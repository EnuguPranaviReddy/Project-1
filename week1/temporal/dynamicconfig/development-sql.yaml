# Development-time dynamic config for the local Temporal dev server.
# Mounted into the container at /etc/temporal/config/dynamicconfig.
#
# These are dev conveniences only. Production clusters should set retention and
# matching limits deliberately rather than copying this file.

# Refresh search attribute caches on every read so the Web UI never shows stale data
# during a fast-moving local demo.
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
    constraints: {}

# Allow long-running workflow histories (a 45-minute delivery mission with per-leg
# activities can generate a lot of history events).
limits.maxWorkflowExecutionHistoryLength:
  - value: 20000
    constraints: {}

# Warn instead of failing if a task queue is polled slowly while your machine is busy.
matching.forwarderMaxTaskRps:
  - value: 100
    constraints: {}
